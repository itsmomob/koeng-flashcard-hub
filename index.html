<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastery Hub · Korean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional styles for the new layout */
    .topic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .topic-pill {
      background: var(--surface);
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-light);
      letter-spacing: 0.01em;
      user-select: none;
    }
    .topic-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(82, 121, 111, 0.3);
    }
    .topic-pill:hover { 
      background: var(--primary-hover); 
      color: #fff; 
    }

    /* Simplified card - no 3D flip */
    .flashcard-container {
      width: 100%;
      min-height: 280px;
      margin-bottom: 20px;
      cursor: default;
    }

    .card-display {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 30px;
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.3);
      text-align: center;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card-front-text {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .card-back-text {
      font-size: 1.6rem;
      font-weight: 600;
      color: #d8f3dc;
      margin-top: 8px;
    }

    .card-back-text.hidden {
      display: none;
    }

    .example-box {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-light);
      font-style: italic;
      background: rgba(47, 62, 70, 0.6);
      padding: 10px 14px;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      line-height: 1.4;
    }

    .reveal-btn {
      margin-top: 16px;
      padding: 10px 24px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      font-family: inherit;
    }

    .reveal-btn:hover {
      background: var(--primary-hover);
    }

    .reveal-btn.revealed {
      background: #3e5c5d;
      border: 1px solid var(--border);
      color: var(--text-light);
    }

    .reveal-btn.revealed:hover {
      background: var(--primary-hover);
      color: var(--text);
    }

    /* Rest of the styles remain the same */
    .controls, .input-section {
      background: var(--surface);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input[type="text"] {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background-color: #2f3e46;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      border-color: var(--text-light);
    }

    .input-row {
      display: flex;
      flex-direction: row;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 2;
      min-width: 160px;
    }

    button.action-btn, button.nav-btn, button.secondary-btn {
      padding: 12px 18px;
      border: none;
      background-color: var(--primary);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      font-family: inherit;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    button.action-btn:hover, button.nav-btn:hover, button.secondary-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .secondary-btn {
      background-color: #3e5c5d;
      border: 1px solid var(--border);
      color: var(--text-light);
    }

    .secondary-btn:hover {
      background-color: var(--primary-hover);
      color: var(--text);
    }

    .feedback {
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 24px;
      text-align: center;
      margin-top: 8px;
    }

    .feedback.correct {
      color: #b7e4c7;
    }

    .feedback.incorrect {
      color: #f4a261;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    button.nav-btn {
      flex: 1;
      padding: 12px 10px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-light);
    }

    button.nav-btn:hover {
      background-color: var(--primary-hover);
      color: var(--text);
    }

    .progress {
      text-align: center;
      font-weight: 600;
      color: var(--text-light);
      font-size: 0.85rem;
      min-width: 90px;
    }

    @media (max-width: 480px) {
      .card-front-text { font-size: 1.6rem; }
      .card-back-text { font-size: 1.3rem; }
      .flashcard-container { min-height: 220px; }
      .card-display { padding: 30px 20px; min-height: 160px; }
    }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <h1>🇰🇷 Mastery Hub</h1>
  <div class="subtitle">choose a topic · active recall</div>

  <!-- topic pills -->
  <div class="topic-bar" id="topicBar">
    <span class="topic-pill" data-topic="topik1">📘 TOPIK 1</span>
    <span class="topic-pill" data-topic="topik2">📗 TOPIK 2</span>
    <span class="topic-pill active" data-topic="topik3">📕 TOPIK 3</span>
    <span class="topic-pill" data-topic="summer">☀️ Summer</span>
    <span class="topic-pill" data-topic="mbti">🧠 MBTI</span>
    <span class="topic-pill" data-topic="business">📊 Business</span>
    <span class="topic-pill" data-topic="emotions">❤️ Emotions</span>
    <span class="topic-pill" data-topic="jobhunting">💼 Job Hunt</span>
  </div>

  <!-- flashcard - no flip -->
  <div class="flashcard-container">
    <div class="card-display">
      <div class="card-front-text" id="cardFront">Loading...</div>
      <div class="card-back-text hidden" id="cardBack">Answer</div>
      <div class="example-box" id="cardExample">Example: ...</div>
      <button class="reveal-btn" id="revealBtn">Show Answer</button>
    </div>
  </div>

  <!-- controls -->
  <div class="controls">
    <div class="control-group">
      <label for="directionSelect">Practice Mode</label>
      <select id="directionSelect">
        <option value="ko-en">🇰🇷 → 🇬🇧</option>
        <option value="en-ko">🇬🇧 → 🇰🇷</option>
      </select>
    </div>
  </div>

  <div class="input-section">
    <label for="userAnswer">Active Recall Input</label>
    <div class="input-row">
      <input type="text" id="userAnswer" placeholder="Type answer…" autocomplete="off">
      <button class="action-btn" id="actionBtn">Verify</button>
      <button class="secondary-btn" id="showBtn">Show</button>
    </div>
    <div class="feedback" id="feedbackMessage"></div>
  </div>

  <!-- navigation -->
  <div class="nav-container">
    <button class="nav-btn" id="prevBtn">← Prev</button>
    <div class="progress" id="progressIndicator">1 / 10</div>
    <button class="nav-btn" id="nextBtn">Next →</button>
  </div>
</div>

<!-- Load all data files -->
<script src="data/summer.js"></script>
<script src="data/mbti.js"></script>
<script src="data/business.js"></script>
<script src="data/emotions.js"></script>
<script src="data/jobhunting.js"></script>
<script src="data/topik1.js"></script>
<script src="data/topik2.js"></script>
<script src="data/topik3.js"></script>

<script>
  // Map topic keys to their data
  const topicMap = {
    summer: { name: 'Summer', data: typeof summerData !== 'undefined' ? summerData : [] },
    mbti: { name: 'MBTI', data: typeof mbtiData !== 'undefined' ? mbtiData : [] },
    business: { name: 'Business', data: typeof businessData !== 'undefined' ? businessData : [] },
    emotions: { name: 'Emotions', data: typeof emotionsData !== 'undefined' ? emotionsData : [] },
    jobhunting: { name: 'Job Hunt', data: typeof jobhuntingData !== 'undefined' ? jobhuntingData : [] },
    topik1: { name: 'TOPIK 1', data: typeof topik1Data !== 'undefined' ? topik1Data : [] },
    topik2: { name: 'TOPIK 2', data: typeof topik2Data !== 'undefined' ? topik2Data : [] },
    topik3: { name: 'TOPIK 3', data: typeof topik3Data !== 'undefined' ? topik3Data : [] }
  };

  // -------- STATE -------------------------------------------------
  let currentTopic = 'topik3';
  let cards = [];
  let currentIndex = 0;
  let direction = 'ko-en';
  let answerRevealed = false;  // Track if answer is shown

  // DOM refs
  const frontEl = document.getElementById('cardFront');
  const backEl = document.getElementById('cardBack');
  const exampleEl = document.getElementById('cardExample');
  const revealBtn = document.getElementById('revealBtn');
  const progressEl = document.getElementById('progressIndicator');
  const feedbackEl = document.getElementById('feedbackMessage');
  const actionBtn = document.getElementById('actionBtn');
  const showBtn = document.getElementById('showBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const userInput = document.getElementById('userAnswer');
  const directionSelect = document.getElementById('directionSelect');
  const topicPills = document.querySelectorAll('.topic-pill');

  // -------- HELPERS -----------------------------------------------
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setActiveTopic(topicKey) {
    topicPills.forEach(p => {
      p.classList.toggle('active', p.dataset.topic === topicKey);
    });
  }

  function hideAnswer() {
    backEl.classList.add('hidden');
    answerRevealed = false;
    revealBtn.textContent = 'Show Answer';
    revealBtn.classList.remove('revealed');
    actionBtn.textContent = 'Verify';
  }

  function showAnswer() {
    backEl.classList.remove('hidden');
    answerRevealed = true;
    revealBtn.textContent = 'Hide Answer';
    revealBtn.classList.add('revealed');
    actionBtn.textContent = 'Next ➔';
  }

  // -------- RENDER CARD -------------------------------------------
  function renderCard() {
    if (!cards.length) {
      frontEl.textContent = 'No data';
      backEl.textContent = 'No data';
      exampleEl.textContent = '✧ No examples';
      progressEl.textContent = '0 / 0';
      return;
    }

    const card = cards[currentIndex];
    const isKoEn = direction === 'ko-en';
    
    frontEl.textContent = isKoEn ? card.ko : card.en;
    backEl.textContent = isKoEn ? card.en : card.ko;
    exampleEl.textContent = `✧ ${card.ex}`;
    progressEl.textContent = `${currentIndex + 1} / ${cards.length}`;
    
    // Reset UI
    hideAnswer();
    userInput.value = '';
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    userInput.focus();
  }

  // -------- LOAD TOPIC --------------------------------------------
  function loadTopic(topicKey) {
    const topic = topicMap[topicKey];
    if (!topic || !topic.data.length) {
      console.warn(`Topic "${topicKey}" not found or empty`);
      return;
    }
    currentTopic = topicKey;
    cards = shuffleArray(topic.data);
    currentIndex = 0;
    setActiveTopic(topicKey);
    renderCard();
  }

  // -------- NAVIGATION --------------------------------------------
  function goNext() {
    if (!cards.length) return;
    currentIndex = (currentIndex + 1) % cards.length;
    renderCard();
  }

  function goPrev() {
    if (!cards.length) return;
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    renderCard();
  }

  // -------- TOGGLE ANSWER -----------------------------------------
  function toggleAnswer() {
    if (answerRevealed) {
      hideAnswer();
    } else {
      showAnswer();
      feedbackEl.textContent = '👀 Answer shown. Press Next or Enter.';
      feedbackEl.className = 'feedback incorrect';
    }
  }

  // -------- CHECK ANSWER ------------------------------------------
  function handleVerify() {
    if (!cards.length) return;
    if (answerRevealed) {
      goNext();
      return;
    }
    const raw = userInput.value.trim();
    if (!raw) {
      feedbackEl.textContent = '✏️ Type an answer first.';
      feedbackEl.className = 'feedback incorrect';
      return;
    }
    const card = cards[currentIndex];
    const target = direction === 'ko-en' ? card.en : card.ko;
    const variants = target.split('/').map(s => s.trim().toLowerCase());
    const cleanVariants = variants.flatMap(v => {
      const clean = v.replace(/\s*\(.*?\)\s*/g, '').trim();
      return [v, clean];
    });
    const inputLower = raw.toLowerCase();
    const isCorrect = cleanVariants.some(v => 
      inputLower === v || (v.length > 2 && inputLower.includes(v))
    );

    if (isCorrect) {
      showAnswer();
      feedbackEl.textContent = '✅ Correct! Press Next or Enter.';
      feedbackEl.className = 'feedback correct';
    } else {
      feedbackEl.textContent = '❌ Incorrect. Try again or use "Show".';
      feedbackEl.className = 'feedback incorrect';
      userInput.value = '';
      userInput.focus();
    }
  }

  // -------- SHOW ANSWER (from button) -----------------------------
  function handleShow() {
    if (!cards.length) return;
    showAnswer();
    feedbackEl.textContent = '👀 Answer shown. Press Next or Enter.';
    feedbackEl.className = 'feedback incorrect';
  }

  // -------- DIRECTION CHANGE --------------------------------------
  function changeDirection() {
    direction = directionSelect.value;
    hideAnswer();
    renderCard();
  }

  // -------- KEYBOARD ----------------------------------------------
  function onInputKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (answerRevealed) {
        goNext();
      } else {
        handleVerify();
      }
    }
  }

  // -------- INIT --------------------------------------------------
  function init() {
    console.log('Data loaded:', {
      summer: typeof summerData !== 'undefined' ? summerData.length : 0,
      mbti: typeof mbtiData !== 'undefined' ? mbtiData.length : 0,
      business: typeof businessData !== 'undefined' ? businessData.length : 0,
      emotions: typeof emotionsData !== 'undefined' ? emotionsData.length : 0,
      jobhunting: typeof jobhuntingData !== 'undefined' ? jobhuntingData.length : 0,
      topik1: typeof topik1Data !== 'undefined' ? topik1Data.length : 0,
      topik2: typeof topik2Data !== 'undefined' ? topik2Data.length : 0,
      topik3: typeof topik3Data !== 'undefined' ? topik3Data.length : 0
    });

    loadTopic('topik3');
    
    // Event listeners
    topicPills.forEach(pill => {
      pill.addEventListener('click', () => {
        const topic = pill.dataset.topic;
        if (topic !== currentTopic) {
          loadTopic(topic);
        }
      });
    });
    
    directionSelect.addEventListener('change', changeDirection);
    actionBtn.addEventListener('click', handleVerify);
    showBtn.addEventListener('click', handleShow);
    revealBtn.addEventListener('click', toggleAnswer);
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    userInput.addEventListener('keydown', onInputKey);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

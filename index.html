<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastery Hub · Korean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional styles for the new layout */
    .topic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .topic-pill {
      background: var(--surface);
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-light);
      letter-spacing: 0.01em;
      user-select: none;
    }
    .topic-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(82, 121, 111, 0.3);
    }
    .topic-pill:hover { 
      background: var(--primary-hover); 
      color: #fff; 
    }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <h1>🇰🇷 Mastery Hub</h1>
  <div class="subtitle">choose a topic · active recall</div>

  <!-- topic pills -->
  <div class="topic-bar" id="topicBar">
    <span class="topic-pill" data-topic="topik1">📘 TOPIK 1</span>
    <span class="topic-pill" data-topic="topik2">📗 TOPIK 2</span>
    <span class="topic-pill active" data-topic="topik3">📕 TOPIK 3</span>
    <span class="topic-pill" data-topic="summer">☀️ Summer</span>
    <span class="topic-pill" data-topic="mbti">🧠 MBTI</span>
    <span class="topic-pill" data-topic="business">📊 Business</span>
    <span class="topic-pill" data-topic="emotions">❤️ Emotions</span>
    <span class="topic-pill" data-topic="jobhunting">💼 Job Hunt</span>
  </div>

  <!-- flashcard -->
  <div class="flashcard-container" id="card3d">
    <div class="card-inner">
      <div class="card-front" id="cardFront">여름</div>
      <div class="card-back">
        <div id="cardBack">summer</div>
        <div class="example-box" id="cardExample">Example: 더운 여름</div>
      </div>
    </div>
  </div>

  <!-- controls -->
  <div class="controls">
    <div class="control-group">
      <label for="directionSelect">Practice Mode</label>
      <select id="directionSelect">
        <option value="ko-en">🇰🇷 → 🇬🇧</option>
        <option value="en-ko">🇬🇧 → 🇰🇷</option>
      </select>
    </div>
  </div>

  <div class="input-section">
    <label for="userAnswer">Active Recall Input</label>
    <div class="input-row">
      <input type="text" id="userAnswer" placeholder="Type answer…" autocomplete="off">
      <button class="action-btn" id="actionBtn">Verify</button>
      <button class="secondary-btn" id="showBtn">Show</button>
    </div>
    <div class="feedback" id="feedbackMessage"></div>
  </div>

  <!-- navigation -->
  <div class="nav-container">
    <button class="nav-btn" id="prevBtn">← Prev</button>
    <div class="progress" id="progressIndicator">1 / 10</div>
    <button class="nav-btn" id="nextBtn">Next →</button>
  </div>
</div>

<!-- Load all data files -->
<script src="data/summer.js"></script>
<script src="data/mbti.js"></script>
<script src="data/business.js"></script>
<script src="data/emotions.js"></script>
<script src="data/jobhunting.js"></script>
<script src="data/topik1.js"></script>
<script src="data/topik2.js"></script>
<script src="data/topik3.js"></script>

<script>
  // Map topic keys to their data (loaded from separate files)
  const topicMap = {
    summer: { name: 'Summer', data: typeof summerData !== 'undefined' ? summerData : [] },
    mbti: { name: 'MBTI', data: typeof mbtiData !== 'undefined' ? mbtiData : [] },
    business: { name: 'Business', data: typeof businessData !== 'undefined' ? businessData : [] },
    emotions: { name: 'Emotions', data: typeof emotionsData !== 'undefined' ? emotionsData : [] },
    jobhunting: { name: 'Job Hunt', data: typeof jobhuntingData !== 'undefined' ? jobhuntingData : [] },
    topik1: { name: 'TOPIK 1', data: typeof topik1Data !== 'undefined' ? topik1Data : [] },
    topik2: { name: 'TOPIK 2', data: typeof topik2Data !== 'undefined' ? topik2Data : [] },
    topik3: { name: 'TOPIK 3', data: typeof topik3Data !== 'undefined' ? topik3Data : [] }
  };

  // -------- STATE -------------------------------------------------
  let currentTopic = 'topik3';
  let cards = [];
  let currentIndex = 0;
  let direction = 'ko-en';
  let isFlipped = false;
  let answeredCorrect = false;

  // DOM refs
  const card3d = document.getElementById('card3d');
  const frontEl = document.getElementById('cardFront');
  const backEl = document.getElementById('cardBack');
  const exampleEl = document.getElementById('cardExample');
  const progressEl = document.getElementById('progressIndicator');
  const feedbackEl = document.getElementById('feedbackMessage');
  const actionBtn = document.getElementById('actionBtn');
  const showBtn = document.getElementById('showBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const userInput = document.getElementById('userAnswer');
  const directionSelect = document.getElementById('directionSelect');
  const topicPills = document.querySelectorAll('.topic-pill');

  // -------- HELPERS -----------------------------------------------
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setActiveTopic(topicKey) {
    topicPills.forEach(p => {
      p.classList.toggle('active', p.dataset.topic === topicKey);
    });
  }

 // -------- RENDER CARD -------------------------------------------
function renderCard() {
    if (!cards.length) {
        frontEl.textContent = 'No data';
        backEl.textContent = 'No data';
        exampleEl.textContent = '✧ No examples';
        progressEl.textContent = '0 / 0';
        return;
    }

    // Get the card data
    const card = cards[currentIndex];
    const isKoEn = direction === 'ko-en';
    
    // Check if the card is currently flipped
    const isCurrentlyFlipped = card3d.classList.contains('flipped');
    
    if (isCurrentlyFlipped) {
        // If flipped, unflip first, then update content after animation
        card3d.classList.remove('flipped');
        isFlipped = false;
        answeredCorrect = false;
        
        // Wait for the flip animation to complete (0.6s) before updating content
        setTimeout(() => {
            updateCardContent(card, isKoEn);
            // Reset input and feedback after content updates
            resetUI();
        }, 600); // Match this to your CSS transition duration (0.6s)
    } else {
        // If not flipped, update content immediately
        updateCardContent(card, isKoEn);
        resetUI();
    }
}

// Helper function to update card content
function updateCardContent(card, isKoEn) {
    frontEl.textContent = isKoEn ? card.ko : card.en;
    backEl.textContent = isKoEn ? card.en : card.ko;
    exampleEl.textContent = `✧ ${card.ex}`;
    progressEl.textContent = `${currentIndex + 1} / ${cards.length}`;
}

// Helper function to reset UI state
function resetUI() {
    isFlipped = false;
    answeredCorrect = false;
    userInput.value = '';
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    actionBtn.textContent = 'Verify';
    userInput.focus();
}

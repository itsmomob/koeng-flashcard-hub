<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - Korean Flashcard Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container practice-container">
        <header class="practice-header">
            <a href="index.html" class="back-link">← Back to Hub</a>
            <h2 id="topic-title">Loading...</h2>
        </header>

        <div class="flashcard-container" id="flashcard">
            <div class="card-inner">
                <div class="card-front">
                    <span class="card-label">Korean</span>
                    <h3 id="ko-text">-</h3>
                </div>
                <div class="card-back">
                    <span class="card-label">English & Example</span>
                    <h3 id="en-text">-</h3>
                    <p id="ex-text">-</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" class="btn">Previous</button>
            <span id="counter">0 / 0</span>
            <button id="next-btn" class="btn">Next</button>
        </div>
    </div>

    <!-- Load all data files -->
    <script src="data/summer.js"></script>
    <script src="data/mbti.js"></script>
    <script src="data/business.js"></script>
    <script src="data/emotions.js"></script>
    <script src="data/jobhunting.js"></script>

    <script>
        const topicMap = {
            summer: { name: "Summer Vacation", data: typeof summerData !== 'undefined' ? summerData : [] },
            mbti: { name: "MBTI & Personality", data: typeof mbtiData !== 'undefined' ? mbtiData : [] },
            business: { name: "Business & Strategy", data: typeof businessData !== 'undefined' ? businessData : [] },
            emotions: { name: "Emotions & Feelings", data: typeof emotionsData !== 'undefined' ? emotionsData : [] },
            jobhunting: { name: "Job Hunting & Interviews", data: typeof jobhuntingData !== 'undefined' ? jobhuntingData : [] }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const topicKey = urlParams.get('topic') || 'summer';
        const currentTopic = topicMap[topicKey] || topicMap.summer;

        document.getElementById('topic-title').innerText = currentTopic.name;

        let currentIndex = 0;
        const dataset = currentTopic.data;

        const flashcard = document.getElementById('flashcard');
        const koText = document.getElementById('ko-text');
        const enText = document.getElementById('en-text');
        const exText = document.getElementById('ex-text');
        const counter = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function loadCard(index) {
            if (dataset.length === 0) {
                koText.innerText = "No data found";
                enText.innerText = "Please check dataset script.";
                exText.innerText = "";
                counter.innerText = "0 / 0";
                return;
            }
            const item = dataset[index];
            koText.innerText = item.ko;
            enText.innerText = item.en;
            exText.innerText = item.ex;
            counter.innerText = `${index + 1} / ${dataset.length}`;
            flashcard.classList.remove('flipped');
        }

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (dataset.length === 0) return;
            currentIndex = (currentIndex - 1 + dataset.length) % dataset.length;
            loadCard(currentIndex);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (dataset.length === 0) return;
            currentIndex = (currentIndex + 1) % dataset.length;
            loadCard(currentIndex);
        });

        // Initialize first card
        loadCard(currentIndex);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - Korean Mastery Hub</title>
    <style>
        :root {
            --primary: #52796f;
            --bg: #2f3e46;
            --surface: #354f52;
            --border: #52796f;
            --text: #fefae0;
            --text-light: #cad2c5;
            --radius: 16px;
        }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; }
        .back-link { color: var(--text-light); text-decoration: none; display: block; margin-bottom: 20px; }
        
        .flashcard-container { perspective: 1000px; width: 100%; height: 300px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard-container.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .card-back { transform: rotateY(180deg); }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Hub</a>
        <h2 id="topic-title">Loading...</h2>

        <div class="flashcard-container" id="flashcard">
            <div class="card-inner">
                <div class="card-front">
                    <h3 id="ko-text">-</h3>
                </div>
                <div class="card-back">
                    <h3 id="en-text">-</h3>
                    <p id="ex-text">-</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" class="btn">Previous</button>
            <span id="counter">0 / 0</span>
            <button id="next-btn" class="btn">Next</button>
        </div>
    </div>

    <script src="data/summer.js"></script>
    <script src="data/mbti.js"></script>
    <script src="data/business.js"></script>
    <script src="data/emotions.js"></script>
    <script src="data/jobhunting.js"></script>

    <script>
        const topicMap = {
            summer: { name: "Summer Vacation", data: typeof summerData !== 'undefined' ? summerData : [] },
            mbti: { name: "MBTI & Personality", data: typeof mbtiData !== 'undefined' ? mbtiData : [] },
            business: { name: "Business & Strategy", data: typeof businessData !== 'undefined' ? businessData : [] },
            emotions: { name: "Emotions & Feelings", data: typeof emotionsData !== 'undefined' ? emotionsData : [] },
            jobhunting: { name: "Job Hunting & Interviews", data: typeof jobhuntingData !== 'undefined' ? jobhuntingData : [] }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const topicKey = urlParams.get('topic') || 'summer';
        const currentTopic = topicMap[topicKey] || topicMap.summer;
        
        document.getElementById('topic-title').innerText = currentTopic.name;
        let currentIndex = 0;
        const dataset = currentTopic.data;
        const flashcard = document.getElementById('flashcard');

        function loadCard(index) {
            const item = dataset[index];
            document.getElementById('ko-text').innerText = item.ko;
            document.getElementById('en-text').innerText = item.en;
            document.getElementById('ex-text').innerText = item.ex;
            document.getElementById('counter').innerText = `${index + 1} / ${dataset.length}`;
            flashcard.classList.remove('flipped');
        }

        flashcard.addEventListener('click', () => flashcard.classList.toggle('flipped'));
        document.getElementById('prev-btn').addEventListener('click', (e) => { e.stopPropagation(); currentIndex = (currentIndex - 1 + dataset.length) % dataset.length; loadCard(currentIndex); });
        document.getElementById('next-btn').addEventListener('click', (e) => { e.stopPropagation(); currentIndex = (currentIndex + 1) % dataset.length; loadCard(currentIndex); });

        if(dataset.length > 0) loadCard(0);
    </script>
</body>
</html>

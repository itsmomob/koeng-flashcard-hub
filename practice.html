<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - Mastery Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="top-nav">
            <a href="index.html" class="back-link">← Choose Topic</a>
            <h1 id="topicTitle" style="margin:0; font-size:1.1rem;">Practice Session</h1>
            <div style="width: 70px;"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="directionSelect">Practice Mode</label>
                <select id="directionSelect" onchange="changeDirection()">
                    <option value="ko-en">Korean ➔ English</option>
                    <option value="en-ko">English ➔ Korean</option>
                </select>
            </div>
        </div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="card-inner" id="card">
                <div class="card-front" id="cardFront">Loading...</div>
                <div class="card-back">
                    <div id="cardBack">Loading...</div>
                    <div class="example-box" id="cardExample">Example: ...</div>
                </div>
            </div>
        </div>

        <div class="input-section">
            <label for="userAnswer">Active Recall Input (Type & Press Enter)</label>
            <div class="input-row">
                <input type="text" id="userAnswer" placeholder="Type target term..." onkeypress="handleKeyPress(event)">
                <button class="action-btn" onclick="checkAnswer()" id="verifyBtn">Verify</button>
                <button class="secondary-btn" onclick="revealAnswer()">Show Answer</button>
            </div>
            <div class="feedback" id="feedbackMessage"></div>
        </div>

        <div class="nav-container">
            <button class="nav-btn" onclick="prevCard()">← Prev</button>
            <div class="progress" id="progressIndicator">1 / 10</div>
            <button class="nav-btn" onclick="nextCard()">Next →</button>
        </div>
    </div>

    <!-- Load all data files -->
    <script src="data/summer.js"></script>
    <script src="data/mbti.js"></script>
    <script src="data/business.js"></script>
    <script src="data/emotions.js"></script>
    <script src="data/jobhunting.js"></script>

    <script>
        const topicMap = {
            summer: { name: "Summer Vacation", data: typeof summerData !== 'undefined' ? summerData : [] },
            mbti: { name: "MBTI & Personality", data: typeof mbtiData !== 'undefined' ? mbtiData : [] },
            business: { name: "Business & Strategy", data: typeof businessData !== 'undefined' ? businessData : [] },
            emotions: { name: "Emotions & Feelings", data: typeof emotionsData !== 'undefined' ? emotionsData : [] },
            jobhunting: { name: "Job Hunting & Interviews", data: typeof jobhuntingData !== 'undefined' ? jobhuntingData : [] }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const topicKey = urlParams.get('topic') || 'summer';
        
        let currentCards = [];
        let currentIndex = 0;
        let isKoreanToEnglish = true;
        let isAnsweredCorrectly = false;

        function initSession() {
            const topicInfo = topicMap[topicKey] || topicMap['summer'];
            document.getElementById('topicTitle').textContent = topicInfo.name;
            currentCards = shuffleArray(topicInfo.data);
            currentIndex = 0;
            updateCard();
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function updateCard() {
            isAnsweredCorrectly = false;
            if (currentCards.length === 0) return;
            const cardData = currentCards[currentIndex];
            const frontElem = document.getElementById('cardFront');
            const backElem = document.getElementById('cardBack');
            const exampleElem = document.getElementById('cardExample');
            const containerElem = document.querySelector('.flashcard-container');
            
            containerElem.classList.remove('flipped');
            
            document.getElementById('userAnswer').value = '';
            document.getElementById('feedbackMessage').textContent = '';
            document.getElementById('feedbackMessage').className = 'feedback';
            document.getElementById('verifyBtn').textContent = 'Verify';

            if (isKoreanToEnglish) {
                frontElem.textContent = cardData.ko;
                backElem.textContent = cardData.en;
            } else {
                frontElem.textContent = cardData.en;
                backElem.textContent = cardData.ko;
            }
            
            exampleElem.textContent = "Example: " + cardData.ex;
            
            document.getElementById('progressIndicator').textContent = 
                `${currentIndex + 1} / ${currentCards.length}`;
        }

        function flipCard() {
            const containerElem = document.querySelector('.flashcard-container');
            containerElem.classList.toggle('flipped');
        }

        function revealAnswer() {
            const containerElem = document.querySelector('.flashcard-container');
            containerElem.classList.add('flipped');
            isAnsweredCorrectly = true;
            const feedbackElem = document.getElementById('feedbackMessage');
            feedbackElem.textContent = "Answer revealed. Press Enter to go to next.";
            feedbackElem.className = "feedback incorrect";
            document.getElementById('verifyBtn').textContent = 'Next ➔';
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % currentCards.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
            updateCard();
        }

        function changeDirection() {
            const select = document.getElementById('directionSelect');
            isKoreanToEnglish = (select.value === 'ko-en');
            updateCard();
        }

        function checkAnswer() {
            if (isAnsweredCorrectly) {
                nextCard();
                return;
            }

            const userInputValue = document.getElementById('userAnswer').value.trim().toLowerCase();
            if (!userInputValue) return;

            const cardData = currentCards[currentIndex];
            let targetAnswer = isKoreanToEnglish ? cardData.en : cardData.ko;
            
            let targets = targetAnswer.toLowerCase().split('/').map(t => t.trim());
            targets = targets.flatMap(t => {
                let clean = t.replace(/\s*\(.*?\)\s*/g, '').trim();
                return [t, clean];
            });

            const feedbackElem = document.getElementById('feedbackMessage');
            const isCorrect = targets.some(t => userInputValue === t || (t.length > 3 && userInputValue.includes(t)));

            if (isCorrect) {
                isAnsweredCorrectly = true;
                feedbackElem.textContent = "Correct! Press Enter again or click Next ➔";
                feedbackElem.className = "feedback correct";
                document.querySelector('.flashcard-container').classList.add('flipped');
                document.getElementById('verifyBtn').textContent = 'Next ➔';
            } else {
                feedbackElem.textContent = "Incorrect. Try again, or use 'Show Answer'.";
                feedbackElem.className = "feedback incorrect";
                document.getElementById('userAnswer').value = '';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                if (isAnsweredCorrectly) {
                    nextCard();
                } else {
                    checkAnswer();
                }
            }
        }

        initSession();
    </script>
</body>
</html>
